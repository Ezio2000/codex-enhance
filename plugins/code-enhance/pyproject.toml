[project]
name = "code-enhance-mcp"
version = "0.3.0+codex.20260801123057"
description = "Local stdio MCP server for Volcano Ark embeddings and semantic code indexing"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [
    { name = "Xie Ningjun" },
]
keywords = [
    "code",
    "embedding",
    "semantic-search",
    "volcano-ark",
    "mcp",
]
dependencies = [
    "httpx[socks]>=0.28.1,<1",
    "mcp[cli]>=1.28.1,<2",
    "pydantic>=2.12,<3",
]

[project.scripts]
code-enhance-mcp = "code_enhance_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Ezio2000/codex-enhance#readme"
Repository = "https://github.com/Ezio2000/codex-enhance"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.16,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/code_enhance_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: calls the real Volcano Ark Coding Plan embedding endpoint",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
